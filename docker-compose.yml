services:
  agora-api:
    build:
      context: .
      dockerfile: agora-api/Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped

  agora-web:
    build:
      context: .
      dockerfile: agora-web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - agora-api
    restart: unless-stopped
