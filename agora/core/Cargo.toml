[package]
name = "agora-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agora auction core: escrow, bids, buyouts and settlement, with in-memory adapters"

[features]
# In-memory adapters: repository, fake ports and a manual clock.
memory = []

[dependencies]
agora-domain.workspace = true
agora-api.workspace = true
agora-spi.workspace = true
uuid = { workspace = true, features = ["v5", "v7"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
