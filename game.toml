# Settings of game-server, read from the working directory. Set GAME_CONFIG to read another
# file. Every top-level key and the [log] table are optional: a missing one takes the value
# shown here. `catalog` and [[house]] are lists: writing one [[house]] replaces both default
# houses, `catalog` has no default and must be listed, and every key inside an entry is
# required, except commodity.

# Listen address of the HTTP API. The BIND_ADDR environment variable overrides it.
bind_addr = "127.0.0.1:8080"

# Delay in seconds between two settlements of expired auctions. Must be greater than zero.
settle_every_secs = 1

# Item types the game knows. base_value is the value of one item, in copper
# (1 gold = 100 silver = 10 000 copper). item_type must be unique and base_value above zero.
# commodity (optional, false by default): a commodity is sold at a fixed price only and can be
# bought in part, any other item is auctioned and bought whole.
# The starting players (alice, bob, carol) get random gold and a random choice of these items.
# Keep this key above [log] and [[house]]: a key written after a table belongs to that table.
catalog = [
  { item_type = "linen_cloth", name = "Linen cloth", base_value = 13, commodity = true },
  { item_type = "copper_ore", name = "Copper ore", base_value = 5, commodity = true },
  { item_type = "healing_potion", name = "Healing potion", base_value = 250, commodity = true },
  { item_type = "iron_sword", name = "Iron sword", base_value = 4500 },
]

# Log level per target: trace, debug, info, warn, error or off. `default` sets the level of
# every target not listed. The RUST_LOG environment variable overrides the whole table.
# debug on game_core shows every ledger call Agora makes, with its OpId.
# debug on tower_http shows every HTTP response (the ui polls every second).
[log]
game_server = "debug"
game_core = "debug"
tower_http = "info"

# Auction houses opened at startup. At least one is required. Rates are in basis points
# (100 = 1%). Amounts are in copper.
# commission: taken from the final price of a sale.
# min_increment, increment: absolute (per unit) and relative parts of the minimum bid increment.
# deposit: rate applied to the total base value of the stack, times the duration multiplier.
# durations: allowed listing durations in minutes, each once, with a multiplier above zero.
# House names must be unique.

[[house]]
name = "Alliance"
commission = 500
min_increment = 1
increment = 500
deposit = 1500
durations = [
  { minutes = 2, deposit_multiplier = 1 },
  { minutes = 10, deposit_multiplier = 2 },
  { minutes = 30, deposit_multiplier = 4 },
]

[[house]]
name = "Neutral"
commission = 1500
min_increment = 1
increment = 500
deposit = 1500
durations = [
  { minutes = 2, deposit_multiplier = 1 },
  { minutes = 10, deposit_multiplier = 2 },
  { minutes = 30, deposit_multiplier = 4 },
]
