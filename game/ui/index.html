<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agora</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f4ef; color: #222; }
      main { max-width: 1200px; margin: 0 auto; padding: 16px; }
      header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
      header h1 { margin: 0 16px 0 0; }
      .sink { margin-left: auto; color: #777; }
      .message { padding: 8px 12px; border-radius: 4px; }
      .message.ok { background: #e3f4e1; }
      .message.error { background: #f8e0dd; }
      .layout { display: grid; grid-template-columns: 280px 1fr; gap: 24px; margin-top: 16px; }
      @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
      aside ul { padding-left: 18px; }
      .sell { display: flex; flex-direction: column; gap: 8px; }
      .sell label { display: flex; flex-direction: column; font-size: 0.9em; }
      .filters { display: flex; flex-wrap: wrap; gap: 8px; }
      .tab.active { font-weight: bold; }
      section { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; white-space: nowrap; }
      tr.mine { background: #eef3fb; }
      tr.leading { background: #e3f4e1; }
      .actions input { width: 80px; }
    </style>
  </head>
  <body></body>
</html>
