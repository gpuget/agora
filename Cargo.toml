[workspace]
resolver = "3"
members = ["agora/*", "event-sourcing", "game/*", "ledger", "tcg/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.dependencies]
agora-domain = { path = "agora/domain" }
agora-api = { path = "agora/api" }
agora-spi = { path = "agora/spi" }
agora-core = { path = "agora/core" }
event-sourcing = { path = "event-sourcing" }
ledger = { path = "ledger" }
game-domain = { path = "game/domain" }
game-api = { path = "game/api" }
game-spi = { path = "game/spi" }
game-core = { path = "game/core" }
game-dto = { path = "game/dto" }
tcg-domain = { path = "tcg/domain" }
tcg-api = { path = "tcg/api" }
tcg-spi = { path = "tcg/spi" }
tcg-core = { path = "tcg/core" }
tcg-dto = { path = "tcg/dto" }

axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.2"
tracing = "0.1.44"
uuid = "1.27.0"
