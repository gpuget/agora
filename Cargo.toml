[workspace]
resolver = "3"
members = [
    "agora-domain",
    "agora-api",
    "agora-spi",
    "agora-core",
    "game",
    "game-dto",
    "ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agora-domain = { path = "agora-domain" }
agora-api = { path = "agora-api" }
agora-spi = { path = "agora-spi" }
agora-core = { path = "agora-core" }
game-dto = { path = "game-dto" }

axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.2"
uuid = "1.27.0"
